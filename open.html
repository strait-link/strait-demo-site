<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tap a link in the browser</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex;
         align-items: center; justify-content: center; background: #f3f5f4; color: #15211d; }
  main { max-width: 26rem; padding: 2rem; text-align: center; }
  a.btn { display: inline-block; margin: 16px 0; padding: 16px 28px; border-radius: 12px; background: #0b6b57;
          color: #fff; font-weight: 700; font-size: 18px; text-decoration: none; }
  code { font-size: 13px; word-break: break-all; color: #4d5d57; }
  p { color: #4d5d57; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>Tap the link</h1>
  <p>This is a normal web page in your browser, like a site or an email that contains a Strait link.</p>
  <a class="btn" id="go" href="#">Open the link</a>
  <p><code id="url"></code></p>
</main>
<script>
// Only Strait short links (https) are allowed as targets.
const u = new URLSearchParams(location.search).get('u') || '';
const ok = /^https:\/\/[^\s"<>]+$/.test(u);
document.getElementById('go').href = ok ? u : '#';
document.getElementById('url').textContent = ok ? u : 'Open this page from the Strait Link app.';
</script>
</body>
</html>
